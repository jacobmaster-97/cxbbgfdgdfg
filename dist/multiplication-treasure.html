<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>乘法寶藏爭奪戰</title>
  <style>
    :root { --ink:#17324d; --blue:#1976d2; --gold:#ffbd2e; --sand:#fff5d6; --sea:#e8f6ff; --red:#e85555; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif; color:var(--ink); background:linear-gradient(135deg,#dff5ff,#fff7d9); }
    button, input, select { font:inherit; }
    button { cursor:pointer; border:0; touch-action:manipulation; }
    .screen { width:min(1320px,96vw); margin:auto; padding:22px 0 28px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    h1 { margin:0; font-size:clamp(1.7rem,3.4vw,3.2rem); }
    .subtitle { margin:5px 0 0; font-size:1.05rem; color:#4b6376; }
    .timer { min-width:130px; padding:12px 16px; text-align:center; border-radius:18px; background:#17324d; color:white; font-size:1.65rem; font-weight:800; }
    .header-actions { display:flex; align-items:center; gap:10px; }
    .fullscreen { padding:12px 15px; border-radius:15px; background:white; color:#285f78; font-weight:900; box-shadow:0 3px 0 #bcdce8; }
    :fullscreen .screen { width:min(1500px,98vw); padding-top:12px; }
    .teams { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin:20px 0 16px; }
    .team-card { position:relative; padding:15px 18px; border:4px solid transparent; border-radius:22px; background:white; box-shadow:0 4px 0 #c4e5f0; transition:.2s; }
    .team-card.active { border-color:var(--team); transform:translateY(-2px); box-shadow:0 6px 0 color-mix(in srgb,var(--team) 32%,#b8dce8); }
    .team-row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .team-name { font-size:1.2rem; font-weight:800; }
    .score { color:var(--team); font-size:2.1rem; font-weight:900; line-height:1; }
    .shield { font-weight:800; color:#527184; min-height:1.3em; }
    .game { display:grid; grid-template-columns:minmax(280px,1fr) minmax(360px,1.12fr) minmax(280px,1fr); gap:18px; align-items:start; }
    .question-box, .board-wrap, .setup, .end-panel { background:rgba(255,255,255,.93); border-radius:28px; box-shadow:0 8px 24px rgba(51,103,127,.15); }
    .question-box { position:relative; overflow:hidden; padding:25px; min-height:360px; display:flex; flex-direction:column; border:4px solid transparent; transition:.2s; }
    .question-box.active { border-color:var(--team); }
    .question-box.locked { background:#edf3f6; }
    .question-box.locked .panel-content { filter:blur(5px); opacity:.28; pointer-events:none; user-select:none; }
    .lock-screen { position:absolute; inset:0; z-index:1; display:none; place-items:center; padding:28px; background:rgba(231,241,245,.72); text-align:center; color:#577184; font-size:clamp(1.4rem,3vw,2rem); font-weight:900; }
    .question-box.locked .lock-screen { display:grid; }
    .turn-label { text-align:center; color:#527184; font-weight:800; font-size:1.05rem; }
    .question { margin:10px 0 20px; min-height:114px; display:grid; place-items:center; border-radius:22px; background:var(--sand); font-size:clamp(3.4rem,8vw,6.6rem); font-weight:900; letter-spacing:.05em; }
    .hint { text-align:center; font-size:1.08rem; min-height:1.5em; color:#527184; font-weight:700; }
    .answers { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:17px; }
    .answer { min-height:82px; border-radius:18px; background:#eaf6fb; color:var(--ink); font-size:clamp(1.6rem,3vw,2.2rem); font-weight:900; box-shadow:0 4px 0 #c5e4ef; }
    .answer:hover { background:#d3effa; }
    .answer.correct { background:#8ddc99; box-shadow:0 4px 0 #56af63; }
    .answer.wrong { background:#ffa5a5; box-shadow:0 4px 0 #cf5e5e; }
    .answer:disabled { cursor:default; opacity:.78; }
    .board-wrap { padding:18px; }
    .board-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; font-weight:900; font-size:1.25rem; }
    .legend { color:#648093; font-size:.9rem; }
    .board { display:grid; grid-template-columns:repeat(5,1fr); gap:9px; }
    .tile { aspect-ratio:1; min-height:62px; border-radius:16px; background:linear-gradient(135deg,#4bb9e8,#207ac9); color:white; font-size:clamp(1.4rem,2.6vw,2rem); font-weight:900; box-shadow:0 4px 0 #1260a2; }
    .tile.available { animation:pulse 1.1s infinite alternate; outline:4px solid #ffca3a; outline-offset:1px; }
    .tile.opened { cursor:default; animation:none; box-shadow:inset 0 0 0 3px rgba(23,50,77,.12); }
    .tile.gold { background:#ffd563; color:#754a00; }
    .tile.bad { background:#ff8585; }
    .tile.special { background:#b494ec; }
    @keyframes pulse { to { transform:scale(1.04); } }
    .controls { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:18px; }
    .control, .primary { padding:12px 18px; border-radius:14px; font-weight:900; background:#e1edf2; color:var(--ink); }
    .primary { background:var(--blue); color:white; box-shadow:0 4px 0 #115a9f; }
    .setup, .end-panel { max-width:640px; margin:8vh auto; padding:32px; text-align:center; }
    .setup h2, .end-panel h2 { margin:0 0 10px; font-size:2rem; }
    .setup p { color:#5c7484; line-height:1.6; }
    .rules { margin:20px 0; padding:16px; border-radius:18px; background:#f0f9fd; text-align:left; }
    .rules-title { margin-bottom:10px; color:#285f78; font-weight:900; text-align:center; }
    .rules-list { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
    .rule { min-height:76px; display:grid; place-items:center; padding:8px 4px; border-radius:12px; background:white; text-align:center; font-size:.88rem; font-weight:800; line-height:1.35; box-shadow:0 2px 0 #cae6ef; }
    .rule span { display:block; font-size:1.35rem; }
    .setup-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:22px 0; }
    label { text-align:left; font-weight:800; color:#456172; }
    input, select { width:100%; margin-top:7px; padding:12px; border:2px solid #c5e4ef; border-radius:12px; font-size:1.1rem; }
    .large { padding:16px 28px; font-size:1.2rem; }
    .hidden { display:none !important; }
    .event { font-size:1.55rem; font-weight:900; color:#285f78; min-height:2.2em; display:grid; place-items:center; text-align:center; }
    .end-panel .winner { font-size:2.4rem; color:#e08700; font-weight:900; margin:20px 0; }
    .end-panel p { font-size:1.15rem; color:#4d6878; }
    @media (max-width:780px) { .screen { width:min(96vw,620px); } .game { grid-template-columns:1fr; } .question-box { min-height:0; } .rules-list { grid-template-columns:repeat(3,1fr); } .header-actions { gap:6px; } .fullscreen { padding:10px; } }
  </style>
</head>
<body>
  <main class="screen">
    <section id="setup" class="setup">
      <h2>🏝️ 乘法寶藏爭奪戰</h2>
      <p>答對 1–10 乘法題，才可打開一個神秘寶藏格。累積最高分數的隊伍獲勝！</p>
      <section class="rules" aria-label="寶藏格規則">
        <div class="rules-title">玩法：答對後選一格，看看找到甚麼！</div>
        <div class="rules-list">
          <div class="rule"><span>🎁</span>寶箱<br>加分</div>
          <div class="rule"><span>💣</span>炸彈<br>扣 10 分</div>
          <div class="rule"><span>🛡️</span>護盾<br>擋一次炸彈</div>
          <div class="rule"><span>🏴‍☠️</span>偷分<br>取對手 10 分</div>
          <div class="rule"><span>⚡</span>再來一次<br>再答一題</div>
        </div>
      </section>
      <div class="setup-grid">
        <label>第一隊名稱<input id="name0" maxlength="12" value="海盜隊"></label>
        <label>第二隊名稱<input id="name1" maxlength="12" value="探險隊"></label>
        <label>遊戲時間<select id="duration"><option value="300">5 分鐘</option><option value="600" selected>10 分鐘</option><option value="900">15 分鐘</option></select></label>
        <label>翻開格數<select id="tileCount"><option value="16">16 格</option><option value="25" selected>25 格</option></select></label>
      </div>
      <button id="start" class="primary large">開始尋寶</button>
    </section>

    <section id="play" class="hidden">
      <header><div><h1>🏝️ 乘法寶藏爭奪戰</h1><p class="subtitle">答對後，請在地圖上選一個格子。</p></div><div class="header-actions"><button id="fullscreen" class="fullscreen" aria-label="切換全螢幕">⛶ 全螢幕</button><div id="timer" class="timer">10:00</div></div></header>
      <div id="teams" class="teams"></div>
      <div class="game">
        <section id="teamPanel0" class="question-box" style="--team:#e65b54">
          <div class="panel-content"><div id="turnLabel0" class="turn-label"></div><div id="question0" class="question"></div><div id="hint0" class="hint"></div><div id="answers0" class="answers"></div><div id="event0" class="event hidden"></div></div>
          <div class="lock-screen">🔒<br>等待輪到你</div>
        </section>
        <section class="board-wrap">
          <div class="board-title"><span>🗺️ 神秘寶藏地圖</span><span id="remaining" class="legend"></span></div>
          <div id="board" class="board"></div>
          <div class="controls"><button id="restart" class="control">重新開始</button><button id="end" class="control">結束遊戲</button></div>
        </section>
        <section id="teamPanel1" class="question-box" style="--team:#377ed2">
          <div class="panel-content"><div id="turnLabel1" class="turn-label"></div><div id="question1" class="question"></div><div id="hint1" class="hint"></div><div id="answers1" class="answers"></div><div id="event1" class="event hidden"></div></div>
          <div class="lock-screen">🔒<br>等待輪到你</div>
        </section>
      </div>
    </section>
    <section id="finished" class="end-panel hidden"><h2>🏆 遊戲結束</h2><div id="winner" class="winner"></div><p id="finalScores"></p><button id="playAgain" class="primary large">再玩一次</button></section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const colors = ['#e65b54','#377ed2'];
    let teams, current, question, used, boardEvents, phase, remainingSeconds, interval;

    function randomInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
    function shuffle(items){ return [...items].sort(()=>Math.random()-.5); }
    function updateTeams(){
      $('teams').innerHTML = teams.map((team,i)=>`<article class="team-card ${i===current?'active':''}" style="--team:${colors[i]}"><div class="team-row"><span class="team-name">${i===current?'▶ ':''}${team.name}</span><span class="score">${team.score}</span></div><div class="shield">${team.shields ? '🛡️ 護盾 × '+team.shields : '　'}</div></article>`).join('');
    }
    function updateTimer(){ const m=Math.floor(remainingSeconds/60), s=remainingSeconds%60; $('timer').textContent=`${m}:${String(s).padStart(2,'0')}`; }
    function updateFullscreenButton(){ $('fullscreen').textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'⛶ 離開全螢幕':'⛶ 全螢幕'; }
    async function toggleFullscreen(){
      const isFullscreen=document.fullscreenElement||document.webkitFullscreenElement;
      try {
        if(isFullscreen) await Promise.resolve((document.exitFullscreen||document.webkitExitFullscreen).call(document));
        else await Promise.resolve((document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement));
      } catch(error) { alert('這個瀏覽器未能啟用全螢幕。'); }
      updateFullscreenButton();
    }
    function panel(id,team){ return $(`${id}${team}`); }
    function setPanelState(team, isActive){
      const box=panel('teamPanel',team); box.classList.toggle('active',isActive); box.classList.toggle('locked',!isActive);
    }
    function makeQuestion(){
      if(used.size >= 55) used.clear();
      let a,b,key;
      do { a=randomInt(1,10); b=randomInt(1,10); key=[Math.min(a,b),Math.max(a,b)].join('x'); } while(used.has(key));
      used.add(key); question={a,b,answer:a*b};
      let answers=new Set([question.answer]);
      while(answers.size<4){ let offset=randomInt(-12,12); if(!offset) offset=1; let candidate=Math.max(1,question.answer+offset); answers.add(candidate); }
      [0,1].forEach(team=>{
        const active=team===current; setPanelState(team,active);
        panel('turnLabel',team).textContent=active?`輪到 ${teams[team].name} 答題`:`${teams[team].name} 準備中`;
        panel('question',team).textContent=active?`${a} × ${b} = ?`:'';
        panel('hint',team).textContent=active?'選出正確答案':'';
        panel('event',team).classList.add('hidden');
        panel('answers',team).classList.toggle('hidden',!active);
        if(active){
          panel('answers',team).innerHTML=shuffle([...answers]).map(value=>`<button class="answer" data-value="${value}">${value}</button>`).join('');
          panel('answers',team).querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>answer(Number(button.dataset.value),button)));
        } else panel('answers',team).innerHTML='';
      });
      phase='answer'; updateTeams();
    }
    function answer(value,button){
      if(phase!=='answer') return;
      const buttons=[...panel('answers',current).querySelectorAll('button')]; buttons.forEach(b=>b.disabled=true);
      if(value===question.answer){
        button.classList.add('correct'); panel('hint',current).textContent='答對了！請在地圖選一格尋寶。'; phase='choose';
        document.querySelectorAll('.tile:not(.opened)').forEach(t=>t.classList.add('available'));
      } else {
        button.classList.add('wrong'); buttons.find(b=>Number(b.dataset.value)===question.answer).classList.add('correct');
        panel('hint',current).textContent=`可惜，正確答案是 ${question.answer}。輪到下一隊。`;
        setTimeout(nextTurn,1500);
      }
    }
    function buildEvents(count){
      const pool=['gold10','gold10','gold20','gold20','gold30','gold30','gold50','bomb','bomb','steal','shield','again','gold10','gold20','gold30','bomb','steal','shield','again','gold10','gold20','gold30','gold50','bomb','steal'];
      return shuffle(pool).slice(0,count);
    }
    function buildBoard(count){
      boardEvents=buildEvents(count); const board=$('board'); board.innerHTML=''; board.style.gridTemplateColumns = count===16?'repeat(4,1fr)':'repeat(5,1fr)';
      boardEvents.forEach((_,i)=>{const tile=document.createElement('button'); tile.className='tile'; tile.textContent='?'; tile.setAttribute('aria-label',`神秘格 ${i+1}`); tile.addEventListener('click',()=>openTile(i,tile)); board.append(tile);});
      updateRemaining();
    }
    function updateRemaining(){ const unopened=boardEvents.filter(e=>e!==null).length; $('remaining').textContent=`尚餘 ${unopened} 格`; }
    function openTile(index,tile){
      if(phase!=='choose'||boardEvents[index]===null) return;
      document.querySelectorAll('.tile').forEach(t=>t.classList.remove('available'));
      const event=boardEvents[index]; boardEvents[index]=null; tile.classList.add('opened'); let message='';
      if(event.startsWith('gold')){ const points=Number(event.slice(4)); teams[current].score+=points; tile.classList.add('gold'); tile.textContent=`+${points}`; message=`🎁 找到寶箱！${teams[current].name} 獲得 ${points} 分。`; }
      if(event==='bomb'){ tile.classList.add('bad'); tile.textContent='💣'; if(teams[current].shields){teams[current].shields--; message=`🛡️ 炸彈來襲，但護盾保護了 ${teams[current].name}！`;}else{teams[current].score=Math.max(0,teams[current].score-10); message=`💣 踩中炸彈！${teams[current].name} 扣 10 分。`;}}
      if(event==='shield'){ tile.classList.add('special'); tile.textContent='🛡️'; teams[current].shields++; message=`🛡️ 找到護盾！可抵擋一次炸彈。`; }
      if(event==='steal'){ tile.classList.add('special'); tile.textContent='🏴‍☠️'; const other=(current+1)%2; const points=Math.min(10,teams[other].score); teams[other].score-=points; teams[current].score+=points; message=`🏴‍☠️ 海盜突襲！從 ${teams[other].name} 取得 ${points} 分。`; }
      if(event==='again'){ tile.classList.add('special'); tile.textContent='⚡'; message=`⚡ 再來一次！${teams[current].name} 可以再答一題。`; }
      updateTeams(); updateRemaining(); panel('answers',current).classList.add('hidden'); panel('hint',current).textContent=''; panel('event',current).textContent=message; panel('event',current).classList.remove('hidden');
      setTimeout(()=>{ if(boardEvents.every(e=>e===null)) finish(); else if(event==='again') makeQuestion(); else nextTurn(); },1800);
    }
    function nextTurn(){ current=(current+1)%2; makeQuestion(); }
    function finish(){ clearInterval(interval); phase='finished'; $('play').classList.add('hidden'); $('finished').classList.remove('hidden'); const [a,b]=teams; const result=a.score===b.score?'平手！兩隊都很厲害。':`${a.score>b.score?a.name:b.name} 勝出！`; $('winner').textContent=result; $('finalScores').textContent=`${a.name}：${a.score} 分　｜　${b.name}：${b.score} 分`; }
    function start(){
      teams=[{name:$('name0').value.trim()||'海盜隊',score:0,shields:0},{name:$('name1').value.trim()||'探險隊',score:0,shields:0}]; current=0; used=new Set(); remainingSeconds=Number($('duration').value); clearInterval(interval); updateTimer();
      $('setup').classList.add('hidden'); $('finished').classList.add('hidden'); $('play').classList.remove('hidden'); buildBoard(Number($('tileCount').value)); makeQuestion();
      interval=setInterval(()=>{remainingSeconds--; updateTimer(); if(remainingSeconds<=0) finish();},1000);
    }
    $('start').addEventListener('click',start); $('playAgain').addEventListener('click',()=>{$('finished').classList.add('hidden');$('setup').classList.remove('hidden');});
    $('restart').addEventListener('click',()=>{ if(confirm('確定重新開始本局？')) start(); }); $('end').addEventListener('click',finish);
    $('fullscreen').addEventListener('click',toggleFullscreen); document.addEventListener('fullscreenchange',updateFullscreenButton); document.addEventListener('webkitfullscreenchange',updateFullscreenButton);
  </script>
</body>
</html>
